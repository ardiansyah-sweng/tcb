services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tcb
      POSTGRES_USER: tcb
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcb -d tcb"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: ./api
    environment: &api-env
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: tcb
      DB_USERNAME: tcb
      DB_PASSWORD: secret
      QUEUE_CONNECTION: database
    volumes:
      - ./api:/var/www/api
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./api
    command: ["php", "artisan", "queue:work", "--tries=3"]
    environment: *api-env
    volumes:
      - ./api:/var/www/api
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy

  web:
    build: ./web
    environment:
      API_PROXY_TARGET: http://app:8000
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - app

volumes:
  db-data:
  web-node-modules:
