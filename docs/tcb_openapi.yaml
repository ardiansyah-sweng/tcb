openapi: 3.1.0
info:
  title: TCB (Task Control Block) API
  version: 1.0.0
  description: |
    Kontrak REST API TCB v1 untuk klien web sekarang dan klien mobile nanti.
    Sumber: SRS TCB v1. Integrasi eksternal hanya Google Calendar (Git ditiadakan).

    Prinsip:
    - Hanya `title` wajib saat membuat task; field lain opsional dan berdefault.
    - Perubahan status selalu lewat endpoint transisi, bukan PATCH task, agar aturan
      state machine, WIP limit, dan simpan konteks berjalan di satu tempat.
    - Sumber eksternal (kalender) hanya membuat *proposal*; pengguna yang memutuskan.
    - Waktu dalam ISO 8601 (UTC); klien menampilkan sesuai zona waktu pengguna.
    - Semua endpoint selain `/health` dan `/auth/login` memerlukan token Bearer;
      tanpa token yang sah responsnya 401 (`Unauthorized`).
servers:
  - url: https://tcb.example.com/api/v1
security:
  - bearerAuth: []

tags:
  - name: Sistem
  - name: Autentikasi
  - name: Pengguna
  - name: Goal
  - name: Task
  - name: Transisi
  - name: Konteks
  - name: Dependensi
  - name: Rekomendasi
  - name: Kalender
  - name: Proposal
  - name: Metrik

paths:
  # ------------------------------------------------------------------ Sistem
  /health:
    get:
      tags: [Sistem]
      summary: Status API dan koneksi database (tanpa autentikasi)
      operationId: getHealth
      security: []
      responses:
        '200':
          description: API dan database berjalan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example: { status: ok, database: ok }
        '503':
          description: API berjalan, tetapi database tidak bisa dihubungi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example: { status: ok, database: error }

  # ------------------------------------------------------------- Autentikasi
  /auth/login:
    post:
      tags: [Autentikasi]
      summary: Masuk dengan email dan kata sandi; menghasilkan token Sanctum
      description: |
        Tidak ada endpoint registrasi; akun dibuat lewat `php artisan tcb:create-user`.
        Token berlaku 30 hari. Maksimal 5 percobaan gagal per menit untuk satu email dan IP.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Berhasil masuk
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '422':
          description: Data tidak lengkap, atau email/kata sandi salah
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationErrorBody' }
              example:
                message: Email atau kata sandi salah.
                errors: { email: [Email atau kata sandi salah.] }
        '429':
          description: Terlalu banyak percobaan masuk
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                code: too_many_attempts
                message: Terlalu banyak percobaan masuk. Coba lagi dalam 60 detik.
  /auth/logout:
    post:
      tags: [Autentikasi]
      summary: Keluar; mencabut token yang sedang dipakai
      operationId: logout
      responses:
        '204': { description: Token dicabut }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ------------------------------------------------------------------ Pengguna
  /me:
    get:
      tags: [Pengguna]
      summary: Profil dan pengaturan pengguna
      operationId: getMe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Pengguna]
      summary: Ubah pengaturan (WIP limit, bobot skor, jam kerja, zona waktu)
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ---------------------------------------------------------------------- Goal
  /objectives:
    get:
      tags: [Goal]
      summary: Daftar Objective beserta progresnya
      operationId: listObjectives
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [active, closed, archived] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Objective' }
    post:
      tags: [Goal]
      summary: Buat Objective
      operationId: createObjective
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ObjectiveInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Objective' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /objectives/{objectiveId}:
    parameters:
      - $ref: '#/components/parameters/ObjectiveId'
    get:
      tags: [Goal]
      summary: Detail Objective, Key Result, dan alokasi waktu
      operationId: getObjective
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObjectiveDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Goal]
      summary: Ubah Objective (termasuk menutup atau mengarsipkan)
      operationId: updateObjective
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ObjectiveUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Objective' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /objectives/{objectiveId}/key-results:
    parameters:
      - $ref: '#/components/parameters/ObjectiveId'
    post:
      tags: [Goal]
      summary: Tambah Key Result
      operationId: createKeyResult
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KeyResultInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeyResult' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /key-results/{keyResultId}:
    parameters:
      - $ref: '#/components/parameters/KeyResultId'
    patch:
      tags: [Goal]
      summary: Ubah Key Result (bobot, mode progres, nilai manual)
      operationId: updateKeyResult
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KeyResultUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeyResult' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Goal]
      summary: Hapus Key Result (task terkait menjadi orphan)
      operationId: deleteKeyResult
      responses:
        '204': { description: Dihapus }

  # ---------------------------------------------------------------------- Task
  /tasks:
    get:
      tags: [Task]
      summary: Daftar task (papan status)
      description: Task Ready diurutkan menurut skor rekomendasi terbaru bila `sort=score`.
      operationId: listTasks
      parameters:
        - name: state
          in: query
          description: Satu atau beberapa status, dipisah koma.
          schema: { type: string, example: 'ready,running,waiting' }
        - name: key_result_id
          in: query
          schema: { type: integer }
        - name: objective_id
          in: query
          schema: { type: integer }
        - name: label
          in: query
          description: Jenis pekerjaan, misalnya Mengajar, Menulis paper, Koreksi ujian.
          schema: { type: string }
        - name: orphan
          in: query
          description: true = hanya task tanpa Key Result.
          schema: { type: boolean }
        - name: q
          in: query
          description: Cari di judul dan kunci task.
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, enum: [score, deadline, updated], default: updated }
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Task' }
                  next_cursor: { type: [string, 'null'] }
    post:
      tags: [Task]
      summary: Buat task (cukup judul; masuk sebagai New)
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskCreate' }
            examples:
              cepat:
                summary: Tambah cepat
                value: { title: Susun soal UAS }
              lengkap:
                summary: Dengan progres satuan
                value:
                  title: Koreksi UTS kelas A
                  key_result_id: 1
                  label: Koreksi ujian
                  estimate_minutes: 240
                  unit_total: 40
                  unit_name: lembar
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Task]
      summary: Detail task beserta konteks terakhir
      operationId: getTask
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Task]
      summary: Ubah data task (bukan status)
      description: Status diubah lewat `POST /tasks/{taskId}/transitions`. Field `state` di sini ditolak.
      operationId: updateTask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskUpdate' }
            examples:
              progres:
                summary: Perbarui progres satuan
                value: { unit_done: 23 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Task]
      summary: Hapus task (soft delete; log dan metrik tetap utuh)
      operationId: deleteTask
      responses:
        '204': { description: Dihapus }

  # ------------------------------------------------------------------ Transisi
  /tasks/{taskId}/transitions:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Transisi]
      summary: Log transisi task (append-only)
      operationId: listTransitions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Transition' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Transisi]
      summary: Ubah status task
      description: |
        Aturan (SRS bagian 4):
        - Hanya transisi sah yang diterima; selain itu 409 `invalid_transition`.
        - Keluar dari `running` (kecuali ke `done`/`cancelled`) wajib membawa `context`.
        - `waiting` dan `cancelled` wajib membawa `reason`.
        - Masuk `running` saat WIP limit penuh → 409 `wip_full` berisi task yang sedang
          berjalan; klien lalu memakai `POST /switch`.
      operationId: transitionTask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransitionRequest' }
            examples:
              jeda:
                value:
                  to: ready
                  context:
                    last_note: 22 dari 40 lembar selesai
                    next_step: Tetapkan skor parsial soal 3
                    unit_done: 22
              terblokir:
                value:
                  to: waiting
                  reason: Menunggu nilai praktikum dari asisten
                  context: { last_note: Nilai teori sudah masuk semua }
      responses:
        '200':
          description: Status berubah
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetail' }
        '409':
          description: Transisi tidak sah atau WIP limit penuh
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/WipFullError'
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /switch:
    post:
      tags: [Transisi]
      summary: Pindah konteks secara atomik
      description: |
        Dalam satu transaksi: simpan konteks task yang sedang berjalan, pindahkan ke
        `ready`/`waiting`/`suspended`, lalu jalankan task tujuan. Gagal sebagian = tidak ada
        yang berubah.
      operationId: switchTask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SwitchRequest' }
      responses:
        '200':
          description: Berhasil pindah
          content:
            application/json:
              schema:
                type: object
                required: [left, started]
                properties:
                  left: { $ref: '#/components/schemas/Task' }
                  started: { $ref: '#/components/schemas/TaskDetail' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ------------------------------------------------------------------- Konteks
  /tasks/{taskId}/contexts:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Konteks]
      summary: Riwayat konteks task (terbaru dulu)
      operationId: listContexts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ContextSnapshot' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Konteks]
      summary: Simpan catatan konteks tanpa mengubah status
      operationId: createContext
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContextInput' }
      responses:
        '201':
          description: Disimpan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContextSnapshot' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /tasks/{taskId}/contexts/draft:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Konteks]
      summary: Isian awal form konteks
      description: Disalin dari konteks terakhir dan progres satuan saat ini, agar pengguna cukup mengoreksi.
      operationId: getContextDraft
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContextInput' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Dependensi
  /tasks/{taskId}/dependencies:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Dependensi]
      summary: Dependensi task
      operationId: listDependencies
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Dependency' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Dependensi]
      summary: Tambah dependensi (task lain atau hambatan eksternal)
      operationId: createDependency
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DependencyInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dependency' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /dependencies/{dependencyId}:
    parameters:
      - name: dependencyId
        in: path
        required: true
        schema: { type: integer }
    patch:
      tags: [Dependensi]
      summary: Tandai hambatan eksternal teratasi
      description: Hanya untuk hambatan eksternal. Dependensi ke task lain terlepas otomatis saat task itu Done, jadi ditolak (422). Permintaan berulang tidak mengubah `resolved_at`.
      operationId: resolveDependency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [resolved] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dependency' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Dependensi]
      summary: Hapus dependensi
      operationId: deleteDependency
      responses:
        '204': { description: Dihapus }
        '404': { $ref: '#/components/responses/NotFound' }

  # --------------------------------------------------------------- Rekomendasi
  /recommendations:
    get:
      tags: [Rekomendasi]
      summary: Rekomendasi task berikutnya beserta alasannya
      operationId: getRecommendations
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 10, default: 3 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecommendationBatch' }

  /recommendations/{recommendationId}/decision:
    parameters:
      - name: recommendationId
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [Rekomendasi]
      summary: Catat keputusan pengguna atas satu rekomendasi
      description: '`picked` hanya mencatat; untuk memulai task, klien tetap memanggil transisi atau /switch.'
      operationId: decideRecommendation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [picked, skipped, scheduled] }
      responses:
        '204': { description: Dicatat }

  # ------------------------------------------------------------------ Kalender
  /integrations/google-calendar:
    get:
      tags: [Kalender]
      summary: Status koneksi Google Calendar
      operationId: getCalendarIntegration
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Integration' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Kalender]
      summary: Putuskan koneksi Google Calendar
      operationId: disconnectCalendar
      responses:
        '204': { description: Diputus }

  /integrations/google-calendar/connect:
    get:
      tags: [Kalender]
      summary: URL persetujuan OAuth Google
      operationId: connectCalendar
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [authorization_url]
                properties:
                  authorization_url: { type: string, format: uri }

  /calendar/free-slots:
    get:
      tags: [Kalender]
      summary: Slot kosong dari kalender utama dalam jam kerja
      operationId: getFreeSlots
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/FreeSlot' }

  /calendar/events:
    get:
      tags: [Kalender]
      summary: Event mendatang untuk dipilih sebagai acuan deadline
      operationId: listCalendarEvents
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: q
          in: query
          description: Cari judul event, misalnya "kuliah".
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CalendarEvent' }

  /tasks/{taskId}/focus-blocks:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Kalender]
      summary: Jadwalkan blok fokus di kalender khusus TCB
      operationId: createFocusBlock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [starts_at, ends_at]
              properties:
                starts_at: { type: string, format: date-time }
                ends_at: { type: string, format: date-time }
      responses:
        '201':
          description: Event dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarLink' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tasks/{taskId}/deadline-anchor:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    put:
      tags: [Kalender]
      summary: Ikat deadline ke event kalender (FR-24, opsional)
      description: Deadline = mulai event − jeda. Jeda default dari pengaturan pengguna (1 hari).
      operationId: setDeadlineAnchor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_id]
              properties:
                event_id: { type: string }
                offset_minutes: { type: integer, minimum: 0, description: 'Kosong = default pengguna' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
    delete:
      tags: [Kalender]
      summary: Lepas ikatan; deadline terakhir dipertahankan sebagai deadline manual
      operationId: removeDeadlineAnchor
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }

  # ------------------------------------------------------------------ Proposal
  /proposals:
    get:
      tags: [Proposal]
      summary: Usulan dari kalender/sistem yang menunggu keputusan
      operationId: listProposals
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, accepted, dismissed, expired], default: pending }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Proposal' }

  /proposals/{proposalId}:
    parameters:
      - name: proposalId
        in: path
        required: true
        schema: { type: integer }
    patch:
      tags: [Proposal]
      summary: Terima atau abaikan usulan
      description: Menerima usulan perubahan status menjalankan transisi yang sama dengan aturan yang sama.
      operationId: decideProposal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [accepted, dismissed] }
                context: { $ref: '#/components/schemas/ContextInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Proposal' }
        '409': { $ref: '#/components/responses/Conflict' }

  # -------------------------------------------------------------------- Metrik
  /metrics:
    get:
      tags: [Metrik]
      summary: Metrik periode (lead time, waktu tunggu, pindah konteks, akurasi estimasi, alokasi)
      operationId: getMetrics
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Metrics' }

  /export:
    get:
      tags: [Metrik]
      summary: Ekspor seluruh data pengguna
      operationId: exportData
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [json, csv], default: json }
      responses:
        '200':
          description: Berkas ekspor
          content:
            application/json:
              schema: { type: object }
            text/csv:
              schema: { type: string }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token Laravel Sanctum.

  parameters:
    TaskId:
      name: taskId
      in: path
      required: true
      description: ID numerik atau kunci task (mis. TCB-31).
      schema: { type: string }
    ObjectiveId:
      name: objectiveId
      in: path
      required: true
      schema: { type: integer }
    KeyResultId:
      name: keyResultId
      in: path
      required: true
      schema: { type: integer }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }

  responses:
    Unauthorized:
      description: Token tidak ada, tidak sah, kedaluwarsa, atau sudah dicabut
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: unauthenticated, message: Silakan masuk terlebih dahulu. }
    NotFound:
      description: Tidak ditemukan
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Bertentangan dengan aturan status atau WIP limit
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/Error'
              - $ref: '#/components/schemas/WipFullError'
    ValidationError:
      description: Data tidak valid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationErrorBody' }

  schemas:
    Health:
      type: object
      required: [status, database]
      properties:
        status: { type: string, enum: [ok] }
        database: { type: string, enum: [ok, error] }
    State:
      type: string
      enum: [new, ready, running, waiting, suspended, done, cancelled]

    User:
      type: object
      required: [id, name, email, timezone, wip_limit, score_weights]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        timezone: { type: string, example: Asia/Jakarta }
        wip_limit: { type: integer, minimum: 1, maximum: 3, default: 1 }
        score_weights: { $ref: '#/components/schemas/ScoreWeights' }
        work_hours:
          type: object
          description: Jam kerja per hari, mis. {"mon":["08:00","17:00"]}.
          additionalProperties:
            type: array
            items: { type: string, pattern: '^\d{2}:\d{2}$' }
            minItems: 2
            maxItems: 2
        default_deadline_offset_minutes: { type: integer, minimum: 0, default: 1440 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        device_name:
          type: string
          maxLength: 100
          description: Nama token, mis. "Laptop kantor". Default "web".

    LoginResponse:
      type: object
      required: [token, token_type, user]
      properties:
        token: { type: string, description: 'Kirim sebagai header `Authorization: Bearer <token>`.' }
        token_type: { type: string, const: Bearer }
        user: { $ref: '#/components/schemas/User' }

    UserUpdate:
      type: object
      properties:
        name: { type: string }
        timezone: { type: string }
        wip_limit: { type: integer, minimum: 1, maximum: 3 }
        score_weights: { $ref: '#/components/schemas/ScoreWeights' }
        work_hours: { type: object }
        default_deadline_offset_minutes: { type: integer, minimum: 0 }

    ScoreWeights:
      type: object
      description: Bobot komponen skor (SRS bagian 6); dinormalisasi agar berjumlah 1.
      properties:
        goal: { type: number, minimum: 0, maximum: 1, default: 0.30 }
        urgency: { type: number, minimum: 0, maximum: 1, default: 0.25 }
        priority: { type: number, minimum: 0, maximum: 1, default: 0.20 }
        aging: { type: number, minimum: 0, maximum: 1, default: 0.15 }
        fit: { type: number, minimum: 0, maximum: 1, default: 0.10 }

    ObjectiveInput:
      type: object
      required: [title, period_start, period_end]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: [string, 'null'] }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }

    ObjectiveUpdate:
      type: object
      properties:
        title: { type: string }
        description: { type: [string, 'null'] }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        status: { type: string, enum: [active, closed, archived] }

    Objective:
      allOf:
        - $ref: '#/components/schemas/ObjectiveInput'
        - type: object
          required: [id, status, progress]
          properties:
            id: { type: integer }
            status: { type: string, enum: [active, closed, archived] }
            progress: { type: number, minimum: 0, maximum: 1, description: Rata-rata berbobot progres KR }

    ObjectiveDetail:
      allOf:
        - $ref: '#/components/schemas/Objective'
        - type: object
          properties:
            key_results:
              type: array
              items: { $ref: '#/components/schemas/KeyResult' }
            orphan_task_count: { type: integer }
            time_allocation:
              type: array
              description: Jam kerja per KR (dan orphan) dalam 7 hari terakhir.
              items:
                type: object
                properties:
                  key_result_id: { type: [integer, 'null'] }
                  hours: { type: number }

    KeyResultInput:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1 }
        weight: { type: number, exclusiveMinimum: 0, maximum: 1, default: 1 }
        progress_mode: { type: string, enum: [auto, manual], default: auto }
        start_value: { type: [number, 'null'] }
        target_value: { type: [number, 'null'], description: Wajib bila progress_mode = manual }
        current_value: { type: [number, 'null'] }
        unit: { type: [string, 'null'] }

    KeyResultUpdate:
      $ref: '#/components/schemas/KeyResultInput'

    KeyResult:
      allOf:
        - $ref: '#/components/schemas/KeyResultInput'
        - type: object
          required: [id, objective_id, progress]
          properties:
            id: { type: integer }
            objective_id: { type: integer }
            progress: { type: number, minimum: 0, maximum: 1 }
            task_counts:
              type: object
              additionalProperties: { type: integer }
              example: { done: 3, running: 1, ready: 2 }

    TaskCreate:
      type: object
      required: [title]
      description: Hanya judul wajib (prinsip input minimal).
      properties:
        title: { type: string, minLength: 1 }
        description: { type: [string, 'null'] }
        key_result_id: { type: [integer, 'null'] }
        parent_task_id: { type: [integer, 'null'] }
        label: { type: [string, 'null'], description: 'Jenis pekerjaan atau proyek' }
        priority: { type: integer, minimum: 1, maximum: 4, default: 2 }
        deadline_at: { type: [string, 'null'], format: date-time }
        estimate_minutes: { type: [integer, 'null'], minimum: 1 }
        energy: { type: string, enum: [focus, light], default: focus }
        unit_done: { type: [number, 'null'], minimum: 0, description: 'Wajib ada unit_total; tidak boleh melebihi unit_total' }
        unit_total: { type: [number, 'null'], exclusiveMinimum: 0 }
        unit_name: { type: [string, 'null'], description: 'Kosong disimpan sebagai "unit" bila unit_total terisi. Saran dari label ada di Task.unit_name_suggestion' }
        start_ready:
          type: boolean
          default: false
          description: true = langsung masuk Ready bila data minimal sudah cukup.

    TaskUpdate:
      type: object
      description: Semua field opsional; `state` tidak diterima di sini.
      properties:
        title: { type: string, minLength: 1 }
        description: { type: [string, 'null'] }
        key_result_id: { type: [integer, 'null'] }
        parent_task_id: { type: [integer, 'null'] }
        label: { type: [string, 'null'] }
        priority: { type: integer, minimum: 1, maximum: 4 }
        deadline_at: { type: [string, 'null'], format: date-time }
        estimate_minutes: { type: [integer, 'null'], minimum: 1 }
        energy: { type: string, enum: [focus, light] }
        next_step: { type: [string, 'null'] }
        unit_done: { type: [number, 'null'], minimum: 0, description: 'Tidak boleh melebihi unit_total (yang dikirim atau yang tersimpan)' }
        unit_total:
          type: [number, 'null']
          exclusiveMinimum: 0
          description: null = hapus progres satuan (unit_done dan unit_name ikut dikosongkan)
        unit_name: { type: [string, 'null'], description: 'Kosong disimpan sebagai "unit" bila unit_total terisi' }

    Task:
      type: object
      required: [id, task_key, title, state, priority, energy, is_orphan, unit_name_suggestion, time_spent_minutes, switch_count, created_at, updated_at]
      properties:
        id: { type: integer }
        task_key: { type: string, example: TCB-31 }
        title: { type: string }
        description: { type: [string, 'null'] }
        key_result_id: { type: [integer, 'null'] }
        is_orphan: { type: boolean }
        parent_task_id: { type: [integer, 'null'] }
        label: { type: [string, 'null'] }
        state: { $ref: '#/components/schemas/State' }
        state_reason: { type: [string, 'null'] }
        state_changed_at: { type: string, format: date-time }
        ready_since: { type: [string, 'null'], format: date-time }
        review_on:
          type: [string, 'null']
          format: date
          readOnly: true
          description: Tanggal tinjau ulang task suspended; diisi lewat POST /tasks/{taskId}/transitions.
        priority: { type: integer, minimum: 1, maximum: 4 }
        deadline_at: { type: [string, 'null'], format: date-time }
        deadline_source: { type: string, enum: [manual, calendar_event] }
        estimate_minutes: { type: [integer, 'null'] }
        energy: { type: string, enum: [focus, light] }
        next_step: { type: [string, 'null'] }
        progress_unit:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ProgressUnit'
        unit_name_suggestion:
          type: string
          readOnly: true
          description: |
            Saran nama satuan dari label, untuk tawaran satu klik di form; tidak disimpan.
            Koreksi ujian → lembar, Menulis paper → halaman, Mengajar → slide; lainnya → unit.
          example: lembar
        time_spent_minutes: { type: integer }
        switch_count: { type: integer }
        last_activity_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ProgressUnit:
      type: object
      required: [done, total, name]
      properties:
        done: { type: number, minimum: 0 }
        total: { type: number, exclusiveMinimum: 0 }
        name: { type: string, example: lembar }

    TaskDetail:
      allOf:
        - $ref: '#/components/schemas/Task'
        - type: object
          properties:
            latest_context:
              oneOf:
                - type: 'null'
                - $ref: '#/components/schemas/ContextSnapshot'
            subtasks:
              type: array
              items: { $ref: '#/components/schemas/Task' }
            open_dependencies:
              type: array
              items: { $ref: '#/components/schemas/Dependency' }
            calendar_links:
              type: array
              items: { $ref: '#/components/schemas/CalendarLink' }
            current_session_started_at: { type: [string, 'null'], format: date-time }

    TransitionRequest:
      type: object
      required: [to]
      properties:
        to: { $ref: '#/components/schemas/State' }
        reason: { type: [string, 'null'], description: Wajib untuk waiting dan cancelled }
        context:
          description: Wajib bila keluar dari running ke ready, waiting, atau suspended.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ContextInput'
        review_on:
          type: [string, 'null']
          format: date
          description: |
            Tanggal tinjau ulang, hanya untuk `to: suspended` (opsional; selain itu 422).
            Disimpan di `Task.review_on` dan dihapus saat task keluar dari suspended.

    SwitchRequest:
      type: object
      required: [from_task_id, from_to, context, to_task_id]
      properties:
        from_task_id: { type: string, description: Task yang sedang running }
        from_to: { type: string, enum: [ready, waiting, suspended], default: ready }
        reason: { type: [string, 'null'], description: Wajib bila from_to = waiting }
        context: { $ref: '#/components/schemas/ContextInput' }
        to_task_id: { type: string }
        recommendation_id: { type: [integer, 'null'], description: Bila pindah karena rekomendasi; dicatat sebagai picked }

    Transition:
      type: object
      required: [id, to_state, source, occurred_at]
      properties:
        id: { type: integer }
        from_state:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/State'
        to_state: { $ref: '#/components/schemas/State' }
        reason: { type: [string, 'null'] }
        source: { type: string, enum: [user, calendar, system] }
        occurred_at: { type: string, format: date-time }

    ContextInput:
      type: object
      description: Semua field opsional; form diisi awal dari GET /contexts/draft.
      properties:
        last_note: { type: [string, 'null'], description: '"Sampai mana?"' }
        next_step: { type: [string, 'null'] }
        blocker: { type: [string, 'null'] }
        unit_done: { type: [number, 'null'], minimum: 0 }
        links:
          type: array
          items: { $ref: '#/components/schemas/Link' }

    ContextSnapshot:
      allOf:
        - $ref: '#/components/schemas/ContextInput'
        - type: object
          required: [id, task_id, created_at]
          properties:
            id: { type: integer }
            task_id: { type: integer }
            created_at: { type: string, format: date-time }

    Link:
      type: object
      required: [url]
      properties:
        title: { type: string }
        url: { type: string, format: uri }

    DependencyInput:
      type: object
      description: Isi tepat salah satu.
      oneOf:
        - required: [depends_on_task_id]
          properties:
            depends_on_task_id: { type: string }
        - required: [external_description]
          properties:
            external_description: { type: string, minLength: 1 }

    Dependency:
      type: object
      required: [id, task_id, status]
      properties:
        id: { type: integer }
        task_id: { type: integer }
        depends_on_task_id: { type: [integer, 'null'] }
        depends_on_task_key: { type: [string, 'null'] }
        external_description: { type: [string, 'null'] }
        status: { type: string, enum: [open, resolved] }
        resolved_at: { type: [string, 'null'], format: date-time }

    RecommendationBatch:
      type: object
      required: [batch_id, generated_at, running_full, items]
      properties:
        batch_id: { type: string, format: uuid }
        generated_at: { type: string, format: date-time }
        running_full:
          type: boolean
          description: true = memulai task akan memicu pindah konteks (/switch).
        items:
          type: array
          items: { $ref: '#/components/schemas/Recommendation' }

    Recommendation:
      type: object
      required: [id, rank, score, breakdown, reasons, task]
      properties:
        id: { type: integer }
        rank: { type: integer, minimum: 1 }
        score: { type: number, minimum: 0, maximum: 1 }
        breakdown:
          type: object
          properties:
            goal: { type: number }
            urgency: { type: number }
            priority: { type: number }
            aging: { type: number }
            fit: { type: number }
        reasons:
          type: array
          description: Dua komponen terbesar dalam kalimat, mis. "Key Result bobot tinggi, progres 30%".
          items: { type: string }
        suggested_slot:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/FreeSlot'
        task: { $ref: '#/components/schemas/Task' }

    Integration:
      type: object
      required: [provider, status]
      properties:
        provider: { type: string, enum: [google_calendar] }
        status: { type: string, enum: [active, expired, revoked, error] }
        primary_calendar_id: { type: [string, 'null'] }
        tcb_calendar_id: { type: [string, 'null'] }
        last_synced_at: { type: [string, 'null'], format: date-time }
        last_error: { type: [string, 'null'] }

    FreeSlot:
      type: object
      required: [starts_at, ends_at, minutes]
      properties:
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        minutes: { type: integer }

    CalendarEvent:
      type: object
      required: [event_id, title, starts_at]
      properties:
        event_id: { type: string }
        calendar_id: { type: string }
        title: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: [string, 'null'], format: date-time }

    CalendarLink:
      type: object
      required: [id, task_id, kind, event_id]
      properties:
        id: { type: integer }
        task_id: { type: integer }
        kind: { type: string, enum: [focus_block, deadline, deadline_anchor] }
        calendar_id: { type: string }
        event_id: { type: string }
        starts_at: { type: [string, 'null'], format: date-time }
        ends_at: { type: [string, 'null'], format: date-time }
        offset_minutes: { type: [integer, 'null'] }
        event_deleted: { type: boolean }

    Proposal:
      type: object
      required: [id, task_id, source, kind, message, status, created_at]
      properties:
        id: { type: integer }
        task_id: { type: integer }
        task_key: { type: string }
        source: { type: string, enum: [calendar, system] }
        kind:
          type: string
          enum: [start_task, save_context, deadline_moved, anchor_deleted, stale_running]
        proposed_state:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/State'
        message: { type: string, example: 'Blok fokus dimulai. Mulai TCB-35 sekarang?' }
        status: { type: string, enum: [pending, accepted, dismissed, expired] }
        created_at: { type: string, format: date-time }

    Metrics:
      type: object
      properties:
        lead_time_hours_median: { type: [number, 'null'] }
        waiting_hours_total: { type: number }
        switches_per_day: { type: number }
        estimate_accuracy_median:
          type: [number, 'null']
          description: Waktu terpakai ÷ estimasi untuk task Done.
        recommendation_pick_rate: { type: [number, 'null'] }
        time_allocation:
          type: array
          items:
            type: object
            properties:
              key_result_id: { type: [integer, 'null'] }
              label: { type: [string, 'null'] }
              hours: { type: number }

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [invalid_transition, context_required, reason_required, not_found, conflict, integration_error, unauthenticated, too_many_attempts]
        message: { type: string }
        details: { type: object }

    WipFullError:
      type: object
      required: [code, message, wip_limit, running]
      properties:
        code: { type: string, const: wip_full }
        message: { type: string }
        wip_limit: { type: integer }
        running:
          type: array
          items: { $ref: '#/components/schemas/Task' }

    ValidationErrorBody:
      type: object
      required: [message, errors]
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
