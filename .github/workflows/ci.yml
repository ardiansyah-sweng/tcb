name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tcb_test
          POSTGRES_USER: tcb
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tcb -d tcb_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: tcb
      DB_PASSWORD: secret
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, intl, zip
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Lint (Pint)
        run: vendor/bin/pint --test
      - name: Test (Pest, PostgreSQL)
        run: php artisan test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test (Vitest)
        run: npm run test
      - name: Build
        run: npm run build

  compose:
    # R1-01: `docker compose up` must bring up app, worker, db, and web.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose up
        run: docker compose up -d --build --wait --wait-timeout 420
      - name: Migrate (queue tables for the worker)
        run: docker compose exec -T app php artisan migrate --force
      - name: API health via app
        run: |
          body=$(curl -fsS http://localhost:8000/api/v1/health)
          echo "$body"
          test "$body" = '{"status":"ok","database":"ok"}'
      - name: API health via web dev server proxy
        run: |
          body=$(curl -fsS http://localhost:5173/api/v1/health)
          echo "$body"
          test "$body" = '{"status":"ok","database":"ok"}'
      - name: Web dev server serves the app
        run: curl -fsS http://localhost:5173/ | grep -q '<div id="root">'
      - name: All four services are running
        run: |
          sleep 10
          for s in db app worker web; do
            docker compose ps --status running --services | grep -qx "$s" || { echo "service $s is not running"; exit 1; }
          done
      - name: Logs on failure
        if: failure()
        run: |
          docker compose ps -a
          for c in $(docker compose ps -aq); do
            echo "== health $(docker inspect --format '{{.Name}}' "$c")"
            docker inspect --format '{{json .State.Health}}' "$c"
          done
          docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
